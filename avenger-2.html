<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tony Stark | Avengers Character Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">AVENGERS</a>

            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Character Header -->
        <section class="character-header">
            <p class="subtitle">MARVEL CHARACTER PROFILE</p>
            <h1>Tony Stark</h1>

        </section>

        <!-- Character Image -->
        <section class="character-image">
            <img 
                src="images/avengers_02.jpg" 
                alt="Tony Stark"
            >
        </section>

        <!-- Biography -->
        <section class="card">
            <h2>Biography</h2>

            <div class="bio-grid">

                <div class="bio-item">
                    <span>Full Name</span>
                    <strong>Tony Stark</strong>
                </div>

                <div class="bio-item">
                    <span>Place of Birth</span>
                    <strong>New York City</strong>
                </div>

                <div class="bio-item">
                    <span>Alignment</span>
                    <strong>Good</strong>
                </div>

                <div class="bio-item">
                    <span>Gender</span>
                    <strong>Male</strong>
                </div>

                <div class="bio-item">
                    <span>Race</span>
                    <strong>Human</strong>
                </div>

            </div>
        </section>


        <!-- Power Stats -->
        <section class="card">
            <h2>Power Stats</h2>

            <div class="stats">

                <div class="stat">
                    <div class="stat-info">
                        <span>Intelligence</span>
                        <strong>100%</strong>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: 100%;"></div>
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-info">
                        <span>Strength</span>
                        <strong>85%</strong>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: 85%;"></div>
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-info">
                        <span>Speed</span>
                        <strong>58%</strong>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: 58%;"></div>
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-info">
                        <span>Durability</span>
                        <strong>85%</strong>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: 85%;"></div>
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-info">
                        <span>Power</span>
                        <strong>100%</strong>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: 100%;"></div>
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-info">
                        <span>Combat</span>
                        <strong>64%</strong>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width: 64%;"></div>
                    </div>
                </div>

            </div>
        </section>

    </main>


</body>
</html>
